<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Vibrant Planet Gradient -->
    <linearGradient id="genoveFaviconPlanet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4BAA2" />
      <stop offset="40%" stop-color="#E09C8D" />
      <stop offset="100%" stop-color="#6C9181" />
    </linearGradient>

    <!-- Golden Orbital Ring Gradient -->
    <linearGradient id="genoveFaviconRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Vibrant Brand Purple Base Circle for high contrast on light/dark browser tabs -->
    <linearGradient id="genoveFaviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C52FF" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
  </defs>

  <!-- Glowing Brand Circle Base -->
  <circle cx="50" cy="50" r="46" fill="url(#genoveFaviconBg)" />

  <!-- Back Portion of Golden Orbital Ring -->
  <path
    d="M 20 68 C 8 50 16 28 38 20 C 62 12 84 20 90 34"
    stroke="url(#genoveFaviconRing)"
    stroke-width="7.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Planet Sphere -->
  <circle cx="50" cy="50" r="28" fill="url(#genoveFaviconPlanet)" />

  <!-- Front Portion of Golden Orbital Ring -->
  <path
    d="M 90 34 C 96 48 84 70 62 80 C 38 90 20 80 20 68"
    stroke="url(#genoveFaviconRing)"
    stroke-width="7.5"
    stroke-linecap="round"
    fill="none"
  />
</svg>
